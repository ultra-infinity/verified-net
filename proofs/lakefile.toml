name = "verified_net"
defaultTargets = ["Udp"]

# Must match the `aeneas` revision locked in `../flake.lock`
# (checked by `nix flake check`; update with `make aeneas-pin`).
[[require]]
name = "aeneas"
git = { url = "https://github.com/AeneasVerif/aeneas", subDir = "backends/lean" }
rev = "e62dd83d133d9043e7d3628096838b7430f36565"

# One library per crate: the model Aeneas generates from it, and the
# hand-written spec and proofs about that model.
[[lean_lib]]
name = "Udp"
